spring.application.name=EasyDOC-backend

# DB: 환경 변수 있으면 사용, 없으면 로컬 기본값
spring.datasource.url=jdbc:mysql://localhost:3306/easydoc?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=your_db_password

# userinfos 테이블은 직접 생성 (docs/userinfos_테이블_생성.sql). users는 JPA로 생성 가능
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

server.port=${PORT:8080}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}
