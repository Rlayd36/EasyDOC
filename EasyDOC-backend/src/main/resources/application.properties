spring.application.name=EasyDOC-backend

# 프로젝트 최상단(.env) 파일을 환경변수처럼 읽어오기 (Spring Boot 2.4+)
spring.config.import=optional:file:../.env

# 강제로 MySQL 방언 지정
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# DB: 로컬 데이터베이스 사용으로 롤백 (AWS RDS 연결 시간 초과 오류)
spring.datasource.url=jdbc:mysql://localhost:3306/easydoc?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

# userinfos 테이블은 직접 생성 (docs/userinfos_테이블_생성.sql). users는 JPA로 생성 가능
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

server.port=${PORT:8080}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# 로컬 실행 시 기본값 사용. 운영 시 JWT_SECRET 환경 변수 설정 권장 (32자 이상)
jwt.secret=${JWT_SECRET:EasyDOC-local-dev-secret-key-min-32-chars!!}
jwt.expiration=${JWT_EXPIRATION:3600000}

# --- Password reset email (Gmail SMTP) ---
# MAIL_ENABLED=true 일 때만 실제 발송. false면 서버 로그에만 재설정 링크 출력(개발/데모용)
app.mail.enabled=${MAIL_ENABLED:false}
app.password-reset.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}
app.password-reset.mail-from=${MAIL_FROM:}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.default-encoding=UTF-8